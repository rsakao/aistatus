name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate manifests and scripts
        run: |
          swift package dump-package >/dev/null
          bash -n script/build_and_run.sh
          bash -n script/build_release_pkg.sh
          bash -n script/verify_release_pkg.sh
          plutil -lint Resources/Info.plist Resources/AIStatus.entitlements

      - name: Run tests
        run: swift test
